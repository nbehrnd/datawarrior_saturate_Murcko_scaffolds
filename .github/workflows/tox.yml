name: tox_pytest_mypy

# name    : tox.yml
# purpose : larger CI if deemed necessary

on:
  workflow_dispatch:  # the manual trigger
  # push:
    # branches: [ dev, main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest] # , macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    env:
      UV_PYTHON_PREFERENCE: only-managed   # use uv managed Python interpreters

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install tox with tox-uv
        run: uv tool install tox --with tox-uv

      - name: Run tox for Python ${{ matrix.python-version }}
        shell: bash
        run: tox -e "py$(echo '${{ matrix.python-version }}' | tr -d .)"
