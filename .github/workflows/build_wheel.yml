name: CI_wheel_datawarrior_saturate_murcko_scaffolds

# name:    build_wheel.yml
# purpose: build a .whl as an artifact without a secret/GitHub token
# date:    [2025-07-23 Wed]

on:
  workflow_dispatch:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
    - name: checkout of the local repository
      uses: actions/checkout@v7

    - name: set up Python
      uses: actions/setup-python@v7  # compare with https://github.com/actions
      with:
        python-version: "3.x"

    - name: provide a virtual environment, resolve dependencies, then build
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install build
        python -m build

    - name: delivery within an archive
      uses: actions/upload-artifact@v7
      with:
        name: datawarrior_saturate_Murcko_scaffolds_wheel
        path: |
          dist/*.whl
          dist/*.tar.gz
