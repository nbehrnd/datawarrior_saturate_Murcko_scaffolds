[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools==84.2.1" ]

[project]
name = "saturate-murcko-scaffolds"
version = "1.3.2"
description = "saturate Murcko scaffolds assigned by DataWarrior as SMILES strings"
readme = "README.md"
keywords = [ "datawarrior", "scaffold" ]
license = "GPL-3.0-only"
license-files = [ "LICENSE" ]
authors = [ { name = "Norwid Behrnd", email = "nbehrnd@yahoo.com" } ]
requires-python = ">=3.11"
# https://pypi.org/classifiers/
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = []  # None (intentionally only Python's standard library)
optional-dependencies.dev = [
  "build==1.6.1",
  "mypy==2.4.1",
  "pre-commit==4.7",
  "pytest==9.2",
  "ruff==0.17.6",
  "tox==4.67.16",
]
urls.Homepage = "https://github.com/nbehrnd/datawarrior_saturate_Murcko_scaffolds"
scripts.saturate_murcko_scaffolds = "saturate_murcko_scaffolds.saturate_murcko_scaffolds:main"

[dependency-groups]
dev = [
  "build==1.6.1",
  "mypy==2.4.1",
  "pre-commit==4.7",
  "pytest==9.2",
  "ruff==0.17.6",
  "tox==4.67.16",
]

[tool.ruff]
target-version = "py313"
line-length = 90
format.indent-style = "space"
format.quote-style = "double"
format.skip-magic-trailing-comma = false
lint.select = [
  "B", # flake8-bugbear
  "E", # pycodestyle, errors
  "F", # pyflakes
  "I", # isort
]
lint.ignore = [
  "E501", # a line too long
]

[tool.repo-review]
ignore = [
  "PY004",
  "PC140",  # pre-commit type checker (it is checked elsewhere)
  "RF002",  # additional Ruff target-version
  "SEC001", # a zizmore check on GHA
  "PC901",  # custom pre-commit CI update message
  "PC902",  # custom pre-commit CI autofix message
  "PC903",  # specified pre-commit CI schedule
]

[tool.codespell]
skip = "*.smi"

[tool.mypy]
files = "src"
python_version = "3.13"
warn_unreachable = true
enable_error_code = [ "ignore-without-code", "redundant-expr", "truthy-bool" ]
strict = false  # because not each function got all relevant type hints

[tool.pytest]
addopts = [ "-ra" ]
filterwarnings = [ "ignore::pytest.PytestCacheWarning" ]
log_level = "INFO"
markers = [
  "blackbox: a black-box test",
  "imported: a test which imports a function of the script",
]
minversion = "9"
pythonpath = [ "src" ]
strict = true
testpaths = [ "tests" ]
