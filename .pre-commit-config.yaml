# date: [2025-01-29 Wed]
# edit: [2026-11-01 Sun]
#
# Notes:
#
# - activation | deactivation: pre-commit install | uninstall
# - use on each file: pre-commt run --all-files
# - commit without a check: git commit -m "message" --no-verify
#
# An installation by `pre-commit install` creates the local folder
# `~/.cache/pre-commit` in with the data supporting the hooks' work.

repos:
  # general purpose / (mostly) agnostic to the language of implementation:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell (cf. configuration `[tool.codespell]`)

  # with (at least some) relation to Python:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
    - id: ruff-check
      args: ["--fix", "--show-fixes", "--exit-zero"]
    - id: ruff-format
      types_or: [python, markdown]

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        # complementary plugins to mdformat
        additional_dependencies:
        - mdformat-gfm

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-use-type-annotations

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.31.2
    hooks:
      - id: pyproject-fmt
        args:
        - --keep-full-version
